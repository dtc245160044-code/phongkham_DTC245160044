{% extends "base.html" %}
{% block title %}Bác sĩ{% endblock %}
{% block content %}
<main>
  <h2>Đội ngũ bác sĩ</h2>
  <div class="panel">
    <form method="post">
      <input name="full_name" placeholder="Họ tên bác sĩ" required>
      <input name="specialty" placeholder="Chuyên khoa" required>
      <input name="phone" placeholder="Số điện thoại">
      <button class="btn btn-primary btn-small">Thêm bác sĩ</button>
    </form>
  </div>
  <div class="grid">
    {% for r in rows %}
    <div class="card">
      <div class="avatar">{{ r.full_name[-1:] }}</div>
      <h3>{{ r.full_name }}</h3>
      <span class="tag">{{ r.specialty }}</span>
      <p>{{ r.phone or '' }}</p>
      <form class="inline" method="post" action="/doctors/{{ r.id }}/delete"><button class="btn btn-danger btn-small">Xóa</button></form>
    </div>
    {% endfor %}
  </div>
</main>
{% endblock %}
